# Backup lock screen only — Island is the normal one. scripts/boot-lock-guard.sh starts hyprlock if Island can't lock
# (crash, broken config…). Plain on purpose: cover colour, clock, password box.
general {
    hide_cursor = false
}

background {
    color = rgb(ebd6d6)
}

label {
    text = $TIME
    font_size = 72
    color = rgb(4a2f4f)
    position = 0, 140
    halign = center
    valign = center
}

input-field {
    size = 320, 56
    outer_color = rgb(4a2f4f)
    inner_color = rgb(fff4e0)
    font_color = rgb(4a2f4f)
    placeholder_text = Password
    position = 0, 0
    halign = center
    valign = center
}
