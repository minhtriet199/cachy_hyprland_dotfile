; Island bar visualizer — raw numbers to stdout, read by Services.qml
[general]
bars = 14
framerate = 20
autosens = 1

[input]
method = pipewire

[output]
method = raw
raw_target = /dev/stdout
data_format = ascii
ascii_max_range = 100
bar_delimiter = 59
frame_delimiter = 10

[smoothing]
noise_reduction = 70
