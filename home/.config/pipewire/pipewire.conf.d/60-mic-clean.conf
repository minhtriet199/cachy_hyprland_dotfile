# "Laptop Mic (clear)": the ALC285 internal mic with the boomy low end removed.
# Sleeps (no CPU) when nothing records from it. Set as the default mic.
context.modules = [
  { name = libpipewire-module-filter-chain
    args = {
      node.description = "Laptop Mic (clear)"
      media.name       = "Laptop Mic (clear)"
      filter.graph = {
        nodes = [
          # 2x high-pass at 140 Hz = steep cut of fan/desk rumble
          { type = builtin name = hp1  label = bq_highpass control = { "Freq" = 140.0 "Q" = 0.707 } }
          { type = builtin name = hp2  label = bq_highpass control = { "Freq" = 140.0 "Q" = 0.707 } }
          # less "boxy" mud
          { type = builtin name = mud  label = bq_peaking  control = { "Freq" = 300.0 "Q" = 1.0 "Gain" = -4.0 } }
          # a bit more speech clarity
          { type = builtin name = pres label = bq_peaking  control = { "Freq" = 3500.0 "Q" = 0.9 "Gain" = 3.0 } }
        ]
        links = [
          { output = "hp1:Out" input = "hp2:In" }
          { output = "hp2:Out" input = "mud:In" }
          { output = "mud:Out" input = "pres:In" }
        ]
      }
      capture.props = {
        node.name      = "mic_clean_capture"
        audio.position = [ MONO ]
        target.object  = "alsa_input.pci-0000_07_00.6.analog-stereo"
        node.passive   = true
      }
      playback.props = {
        node.name      = "mic_clean"
        media.class    = Audio/Source
        audio.position = [ MONO ]
      }
    }
  }
]
