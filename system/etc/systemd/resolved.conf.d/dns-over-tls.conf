[Resolve]
# One encrypted DNS for EVERY network (home, phone hotspot, new Wi-Fi…):
# Google first (it sends the area to CDNs → Steam gets the Vietnam Akamai node, which the ISP does not block;
# Cloudflare gives overseas nodes that the ISP cuts by SNI). Cloudflare is only the backup.
DNS=8.8.8.8#dns.google 8.8.4.4#dns.google 2001:4860:4860::8888#dns.google 1.1.1.1#cloudflare-dns.com 1.0.0.1#cloudflare-dns.com
FallbackDNS=9.9.9.9#dns.quad9.net 149.112.112.112#dns.quad9.net
# use these instead of whatever DNS the router hands out
Domains=~.
# "opportunistic" = encrypted when it works, plain for a few seconds when it can't
# (right after boot the clock is not synced yet and TLS fails, so "yes" meant no internet for ~30 s or more)
DNSOverTLS=opportunistic
