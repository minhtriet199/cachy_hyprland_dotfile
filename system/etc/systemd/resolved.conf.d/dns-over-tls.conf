[Resolve]
# One encrypted DNS for EVERY network (home, phone hotspot, new Wi-Fi…):
# Cloudflare + Google over TLS. Skips the ISP's DNS, so DNS-based blocks in Vietnam (Steam, many sites) don't apply.
DNS=1.1.1.1#cloudflare-dns.com 1.0.0.1#cloudflare-dns.com 8.8.8.8#dns.google 8.8.4.4#dns.google 2606:4700:4700::1111#cloudflare-dns.com 2001:4860:4860::8888#dns.google
FallbackDNS=9.9.9.9#dns.quad9.net 149.112.112.112#dns.quad9.net
# use these instead of whatever DNS the router hands out
Domains=~.
DNSOverTLS=yes
